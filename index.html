<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Supplements">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
<title>My Supplements App</title>
<style>
  :root {
    --bg: #f8f7f4; --text: #1a1a18; --card: #fff; --border: #e8e6e0; --muted: #888780;
    --primary: #1D9E75; --danger: #D83030; --warn-bg: #FFF8ED; --warn-text: #9A6200;
  }
  [data-theme="dark"] {
    --bg: #121212; --text: #f1f1f1; --card: #1e1e1e; --border: #333; --muted: #aaa;
    --warn-bg: #332200; --warn-text: #ffcc66;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Sarabun', sans-serif; background: var(--bg); color: var(--text); padding-bottom: 5rem; transition: background 0.3s; }
  
  .nav { display: flex; background: var(--card); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 20; padding-right: 10px;}
  .nav-tab { flex: 1; padding: 14px 5px; font-family: 'Sarabun'; font-size: 14px; font-weight: 500; color: var(--muted); background: transparent; border: none; cursor: pointer; border-bottom: 2px solid transparent; transition: 0.2s; }
  .nav-tab.active { color: var(--text); border-bottom-color: var(--primary); }
  .btn-theme { background: none; border: none; font-size: 18px; cursor: pointer; padding: 0 10px; }

  .page { display: none; padding: 1.25rem; }
  .page.show { display: block; animation: fadeIn 0.3s; }
  @keyframes fadeIn { from{opacity:0; transform:translateY(5px);} to{opacity:1; transform:translateY(0);} }

  h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  .subtitle { font-size: 13px; color: var(--muted); margin-bottom: 1.25rem; }

  .sync-status { text-align: center; font-size: 11px; padding: 6px; background: var(--primary); color: #fff; display: none; position: sticky; top: 48px; z-index: 19; }
  .sync-status.show { display: block; }

  /* Schedule */
  .day-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1.5rem; }
  .tab { font-size: 12px; font-weight: 500; padding: 6px 12px; border-radius: 20px; border: 1px solid var(--border); color: var(--muted); background: transparent; cursor: pointer; transition: 0.2s; }
  .tab.active { background: var(--text); color: var(--bg); border-color: var(--text); }
  
  .time-block { margin-bottom: 1.5rem; }
  .time-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .time-label { font-size: 13px; font-weight: 600; color: var(--muted); }
  .time-line { flex: 1; height: 1px; background: var(--border); }
  
  .pill-item { background: var(--card); border: 1px solid var(--border); padding: 12px; border-radius: 12px; margin-bottom: 8px; cursor: pointer; display: flex; align-items: center; gap: 12px; transition: 0.2s; }
  .check { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #ccc; display: flex; align-items: center; justify-content: center; font-size: 13px; color: transparent; flex-shrink: 0; transition: 0.2s; }
  .pill-item.done { opacity: 0.6; }
  .pill-item.done .check { background: var(--primary); border-color: var(--primary); color: #fff; }
  .pill-item.done .p-name { text-decoration: line-through; }
  
  .p-info { flex: 1; }
  .p-name { font-size: 14px; font-weight: 500; color: var(--text); display: flex; align-items: center; }
  .p-stock { font-size: 11px; color: var(--muted); display: inline-block; padding: 2px 6px; background: var(--bg); border-radius: 6px; margin-top: 4px; }
  .caution-box { font-size: 11px; color: var(--warn-text); background: var(--warn-bg); padding: 6px 10px; border-radius: 6px; margin-top: 6px; line-height: 1.4; }
  
  .daily-note { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-family: 'Sarabun'; font-size: 13px; resize: none; margin-top: 10px; }

  /* Inventory & Form */
  .inv-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 10px; position: relative; }
  .inv-card.paused { opacity: 0.5; }
  .inv-header { display: flex; justify-content: space-between; align-items: flex-start; }
  .smart-alert { font-size: 11px; color: var(--danger); font-weight: 600; margin-top: 6px; display: flex; align-items: center; gap: 4px; }
  .btn-group { display: flex; gap: 5px; margin-top: 10px; }
  .btn-sm { padding: 6px 12px; font-size: 11px; font-family: 'Sarabun'; border-radius: 6px; border: none; cursor: pointer; }
  .btn-restock { background: var(--primary); color: #fff; }
  .btn-pause { background: var(--border); color: var(--text); }

  .add-form { background: var(--card); border: 1px dashed var(--primary); border-radius: 12px; padding: 15px; margin-bottom: 20px; }
  .form-group { margin-bottom: 12px; }
  .form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; color: var(--muted); }
  .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font-family: 'Sarabun'; font-size: 14px; }
  
  [data-theme="dark"] input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); }

  .checkbox-group { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .checkbox-group label { display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 400; background: var(--bg); padding: 5px 10px; border-radius: 20px; border: 1px solid var(--border); cursor: pointer; }
  .checkbox-group input:checked + span { font-weight: 600; color: var(--primary); }
  
  .btn-all-days { padding: 5px 10px; font-size: 11px; border-radius: 20px; border: 1px solid var(--primary); background: transparent; color: var(--primary); cursor: pointer; transition: 0.2s; font-family: 'Sarabun'; font-weight: 600; margin-left: 5px; }
  .btn-all-days.active { background: var(--primary); color: #fff; }

  .btn-submit { width: 100%; padding: 12px; background: var(--primary); color: #fff; font-family: 'Sarabun'; font-size: 14px; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; }

  /* Progress */
  .prog-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 10px; }
  .prog-bar-bg { height: 6px; background: var(--bg); border-radius: 3px; margin: 8px 0; overflow: hidden; }
  .prog-bar-fill { height: 100%; background: var(--primary); border-radius: 3px; transition: width 0.3s; }
  
  .p-note { font-size: 12px; color: var(--muted); margin-top: 6px; font-weight: 300; line-height: 1.5; }
  .p-ms { display: flex; align-items: center; gap: 6px; margin-top: 5px; }
  .p-ms-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .p-ms-text { font-size: 11px; font-weight: 300; line-height: 1.4; }
  
  /* สีหมวดหมู่ยา */
  .cat-pill { font-size: 10px; padding: 2px 8px; border-radius: 10px; display: inline-flex; align-items: center; gap: 4px; margin-bottom: 5px; font-weight: 500; }
  .p-legend { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; }
  .p-leg { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); font-weight: 400; }
  .p-leg-dot { width: 8px; height: 8px; border-radius: 50%; }
</style>
</head>
<body>

<div class="nav">
  <button class="nav-tab active" onclick="switchPage('schedule')">ตารางยา</button>
  <button class="nav-tab" onclick="switchPage('progress')">ความคืบหน้า</button>
  <button class="nav-tab" onclick="switchPage('inventory')">คลัง/จัดการ</button>
  <button class="btn-theme" onclick="toggleTheme()">🌓</button>
</div>
<div id="sync-banner" class="sync-status">กำลังซิงค์ข้อมูล... ⏳</div>

<div id="page-schedule" class="page show">
  <h1>ตารางประจำวัน</h1>
  <p class="subtitle" id="today-subtitle">เลือกวันเพื่อดูตาราง</p>
  
  <div class="day-tabs" id="day-selector">
    <button class="tab" onclick="selectDay('sun')">อา.</button>
    <button class="tab" onclick="selectDay('mon')">จ.</button>
    <button class="tab" onclick="selectDay('tue')">อ.</button>
    <button class="tab" onclick="selectDay('wed')">พ.</button>
    <button class="tab" onclick="selectDay('thu')">พฤ.</button>
    <button class="tab" onclick="selectDay('fri')">ศ.</button>
    <button class="tab" onclick="selectDay('sat')">ส.</button>
  </div>

  <div id="schedule-content"></div>

  <div style="margin-top: 2rem;">
    <h3 style="font-size: 14px; color: var(--muted);">📝 บันทึกอาการวันนี้</h3>
    <textarea id="daily-note" class="daily-note" rows="3" placeholder="พิมพ์อาการหรือสิ่งที่รู้สึกวันนี้..." onchange="saveDailyNote()"></textarea>
  </div>
</div>

<div id="page-progress" class="page">
  <h1>ความคืบหน้า (Progress)</h1>
  <p class="subtitle">ระบบคำนวณจากวันที่เริ่มกินของแต่ละตัว</p>
  
  <div class="p-legend">
    <div class="p-leg"><div class="p-leg-dot" style="background:#1D9E75;"></div>Fat-soluble</div>
    <div class="p-leg"><div class="p-leg-dot" style="background:#378ADD;"></div>Water-soluble</div>
    <div class="p-leg"><div class="p-leg-dot" style="background:#BA7517;"></div>Mineral</div>
    <div class="p-leg"><div class="p-leg-dot" style="background:#3B6D11;"></div>Gut</div>
    <div class="p-leg"><div class="p-leg-dot" style="background:#7F77DD;"></div>B Complex</div>
    <div class="p-leg"><div class="p-leg-dot" style="background:#C4377A;"></div>Amino / Antioxidant</div>
  </div>

  <div id="progress-content"></div>
</div>

<div id="page-inventory" class="page">
  <h1>จัดการคลังยา</h1>
  <p class="subtitle">ระบบจะเตือนถ้ายาเหลือพอกินไม่ถึง 7 วัน</p>

  <div class="add-form">
    <h3 style="margin-bottom: 15px;">+ เพิ่ม/แก้ไข อาหารเสริม</h3>
    
    <div class="form-group">
      <label>ชื่อยา</label>
      <input type="text" id="f-name" placeholder="เช่น Vitamin C 1,000 มก.">
    </div>

    <div class="form-group">
      <label>หมวดหมู่ (สีของยา)</label>
      <select id="f-cat">
        <option value="Fat-soluble">Fat-soluble (สีเขียวอมฟ้า)</option>
        <option value="Water-soluble">Water-soluble (สีฟ้า)</option>
        <option value="Mineral">Mineral (สีน้ำตาลทอง)</option>
        <option value="Gut">Gut (สีเขียวเข้ม)</option>
        <option value="B Complex">B Complex (สีม่วง)</option>
        <option value="Amino">Amino / Antioxidant (สีชมพูแดง)</option>
        <option value="Other">อื่นๆ (สีเทา)</option>
      </select>
    </div>
    
    <div style="display:flex; gap:10px;">
      <div class="form-group" style="flex:1;">
        <label>จำนวนเม็ด</label>
        <input type="number" id="f-total" placeholder="จำนวนในขวด">
      </div>
      <div class="form-group" style="flex:1;">
        <label>วันที่เริ่มกิน</label>
        <input type="date" id="f-start">
      </div>
    </div>
    
    <div class="form-group">
      <label>วันเวลาที่กิน (กดเลือกได้หลายวัน)</label>
      <div class="checkbox-group" id="f-days">
        <label><input type="checkbox" class="day-cb" value="sun"> <span>อา</span></label>
        <label><input type="checkbox" class="day-cb" value="mon"> <span>จ</span></label>
        <label><input type="checkbox" class="day-cb" value="tue"> <span>อ</span></label>
        <label><input type="checkbox" class="day-cb" value="wed"> <span>พ</span></label>
        <label><input type="checkbox" class="day-cb" value="thu"> <span>พฤ</span></label>
        <label><input type="checkbox" class="day-cb" value="fri"> <span>ศ</span></label>
        <label><input type="checkbox" class="day-cb" value="sat"> <span>ส</span></label>
        <button class="btn-all-days" id="btn-everyday" onclick="toggleEveryday()">กินทุกวัน</button>
      </div>
    </div>
    
    <div class="form-group">
      <label>ช่วงเวลา</label>
      <select id="f-time">
        <option>หลังตื่นนอน</option>
        <option>เช้า</option>
        <option>บ่าย</option>
        <option>ก่อนนอน</option>
      </select>
    </div>
    
    <div class="form-group">
      <label>ระยะเวลาเห็นผล</label>
      <select id="f-group">
        <option value="เห็นผลเร็ว">เห็นผลเร็ว (1-4 สัปดาห์)</option>
        <option value="เห็นผลปานกลาง">ปานกลาง (1-3 เดือน)</option>
        <option value="เห็นผลระยะยาว">ระยะยาว (3 เดือน+)</option>
      </select>
    </div>

    <div class="form-group">
      <label>สรรพคุณ/ประโยชน์ (แสดงในหน้า Progress)</label>
      <input type="text" id="f-note" placeholder="เช่น นอนหลับลึกขึ้น กล้ามเนื้อไม่ล้า">
    </div>
    <div class="form-group">
      <label>ผลลัพธ์รายสัปดาห์ (รูปแบบ: สัปดาห์:ข้อความ | สัปดาห์:ข้อความ)</label>
      <input type="text" id="f-milestones" placeholder="เช่น 1:เริ่มหลับดีขึ้น | 2:ตื่นมาสดชื่น">
    </div>
    
    <div class="form-group">
      <label>เป้าหมายรวม (สัปดาห์)</label>
      <input type="number" id="f-tw" placeholder="เช่น 4">
    </div>
    
    <div class="form-group">
      <label>ข้อควรระวัง (ถ้ามี)</label>
      <input type="text" id="f-cautions" placeholder="เช่น ห้ามกินพร้อมนม">
    </div>
    
    <button class="btn-submit" onclick="saveForm()">บันทึกข้อมูลยา</button>
  </div>

  <div id="inventory-list"></div>
</div>

<script>
// ==========================================
// ส่วนตั้งค่า: URL Google Sheets ของคุณ
// ==========================================
const GOOGLE_SHEET_URL = 'https://script.google.com/macros/s/AKfycbwcGgnNZFar-BvNp175wqdiqDXU0A15lJgPO1Wdbavgna5KLo8HPKEgbkm6gpTSAD2G/exec';

// สีตามหมวดหมู่
const CAT_THEME = {
  'Fat-soluble':   { color: '#1D9E75', bg: '#E1F5EE', text: '#085041' },
  'Water-soluble': { color: '#378ADD', bg: '#E6F1FB', text: '#0C447C' },
  'Mineral':       { color: '#BA7517', bg: '#FAEEDA', text: '#633806' },
  'Gut':           { color: '#3B6D11', bg: '#EAF3DE', text: '#27500A' },
  'B Complex':     { color: '#7F77DD', bg: '#EEEDFE', text: '#3C3489' },
  'Amino':         { color: '#C4377A', bg: '#FDE8F0', text: '#8C1D49' },
  'Other':         { color: '#888780', bg: '#f1efe8', text: '#5f5e5a' }
};

// ==========================================
// ฐานข้อมูลในเครื่อง
// ==========================================
let supplements = []; 
let logs = {}; 

const DAYS_KEY = ['sun','mon','tue','wed','thu','fri','sat'];
let currentDay = DAYS_KEY[new Date().getDay()];
let todayStr = new Date().toISOString().split('T')[0];

// ==========================================
// ฟังก์ชันหลัก (Init & Sync)
// ==========================================
async function initApp() {
  if(localStorage.getItem('theme') === 'dark') document.body.setAttribute('data-theme', 'dark');
  
  document.getElementById('sync-banner').classList.add('show');
  try {
    let res = await fetch(GOOGLE_SHEET_URL);
    let data = await res.json();
    supplements = data.supplements || [];
    logs = data.logs || {};
    
    supplements.forEach(s => {
      s.totalPills = Number(s.totalPills);
      s.leftPills = Number(s.leftPills);
      s.targetWeeks = Number(s.targetWeeks);
      s.active = (s.active === 'true' || s.active === true);
    });
  } catch(e) {
    console.warn("Offline Mode");
  }
  document.getElementById('sync-banner').classList.remove('show');

  selectDay(currentDay);
  document.getElementById('f-start').value = todayStr;
}

function syncData() {
  document.getElementById('sync-banner').classList.add('show');
  fetch(GOOGLE_SHEET_URL, {
    method: 'POST',
    redirect: 'follow',
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ supplements: supplements, logs: logs })
  }).then(() => document.getElementById('sync-banner').classList.remove('show'));
  
  renderSchedule();
  renderProgress();
  renderInventory();
}

// ==========================================
// UI: สลับหน้า & โหมดมืด & เลือกวันในฟอร์ม
// ==========================================
function switchPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('show'));
  document.getElementById('page-'+id).classList.add('show');
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  
  if(id==='schedule') renderSchedule();
  if(id==='progress') renderProgress();
  if(id==='inventory') renderInventory();
  window.scrollTo(0,0);
}

function toggleTheme() {
  const isDark = document.body.hasAttribute('data-theme');
  if(isDark) {
    document.body.removeAttribute('data-theme');
    localStorage.setItem('theme', 'light');
  } else {
    document.body.setAttribute('data-theme', 'dark');
    localStorage.setItem('theme', 'dark');
  }
}

function toggleEveryday() {
  const btn = document.getElementById('btn-everyday');
  const checkboxes = document.querySelectorAll('.day-cb');
  const isAllChecked = Array.from(checkboxes).every(cb => cb.checked);
  
  if (isAllChecked) {
    checkboxes.forEach(cb => cb.checked = false);
    btn.classList.remove('active');
  } else {
    checkboxes.forEach(cb => cb.checked = true);
    btn.classList.add('active');
  }
}

document.querySelectorAll('.day-cb').forEach(cb => {
  cb.addEventListener('change', () => {
    const checkboxes = document.querySelectorAll('.day-cb');
    const isAllChecked = Array.from(checkboxes).every(c => c.checked);
    if(isAllChecked) document.getElementById('btn-everyday').classList.add('active');
    else document.getElementById('btn-everyday').classList.remove('active');
  });
});

// ==========================================
// ระบบ Schedule
// ==========================================
function selectDay(dayKey) {
  currentDay = dayKey;
  document.querySelectorAll('#day-selector .tab').forEach((t, i) => {
    t.classList.toggle('active', DAYS_KEY[i] === dayKey);
  });
  
  let thaiDays = {sun:'อาทิตย์', mon:'จันทร์', tue:'อังคาร', wed:'พุธ', thu:'พฤหัสบดี', fri:'ศุกร์', sat:'เสาร์'};
  document.getElementById('today-subtitle').innerText = `ตารางของวัน${thaiDays[dayKey]}`;
  
  let noteKey = `note_${todayStr}`;
  document.getElementById('daily-note').value = logs[noteKey] || '';

  renderSchedule();
}

function renderSchedule() {
  const container = document.getElementById('schedule-content');
  container.innerHTML = '';

  const times = ['หลังตื่นนอน', 'เช้า', 'บ่าย', 'ก่อนนอน'];
  let hasItem = false;

  times.forEach(t => {
    let meds = supplements.filter(s => s.active && s.days.includes(currentDay) && s.time === t);
    
    if(meds.length > 0) {
      hasItem = true;
      let html = `<div class="time-block">
                    <div class="time-header"><span class="time-label">${t}</span><div class="time-line"></div></div>`;
      
      meds.forEach(m => {
        let logKey = `${todayStr}_${m.id}`;
        let isDone = logs[logKey] ? 'done' : '';
        let checkMark = logs[logKey] ? '✓' : '';
        
        let cautionHTML = m.cautions ? `<div class="caution-box">⚠️ ${m.cautions}</div>` : '';
        
        // จุดสีหน้าชื่อยา
        let theme = CAT_THEME[m.cat] || CAT_THEME['Other'];
        let catDot = `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${theme.color};margin-right:8px;flex-shrink:0;"></span>`;
        
        html += `
          <div class="pill-item ${isDone}" onclick="togglePill('${m.id}')">
            <div class="check">${checkMark}</div>
            <div class="p-info">
              <div class="p-name">${catDot}${m.name}</div>
              <div class="p-stock">เหลือ ${m.leftPills} เม็ด</div>
              ${cautionHTML}
            </div>
          </div>
        `;
      });
      html += `</div>`;
      container.innerHTML += html;
    }
  });

  if(!hasItem) container.innerHTML = `<div style="text-align:center; color:var(--muted); padding:20px;">ไม่มีคิวกินยาวันนี้ 🎉</div>`;
}

function togglePill(id) {
  let logKey = `${todayStr}_${id}`;
  let supp = supplements.find(s => s.id === id);
  if(!supp) return;

  if (logs[logKey]) {
    delete logs[logKey];
    supp.leftPills++;
  } else {
    if (supp.leftPills <= 0) { alert('ยาหมดสต๊อกแล้วครับ!'); return; }
    logs[logKey] = true;
    supp.leftPills--;
  }
  syncData();
}

  logs[`note_${todayStr}`] = val;
  syncData();
}
